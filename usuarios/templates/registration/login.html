{% extends "base.html" %}

{% block content %}
<div class="min-h-screen flex items-center justify-center bg-slate-100">
  <div class="bg-white shadow-md rounded-lg p-8 w-full max-w-sm">
    <h1 class="text-2xl font-semibold mb-6 text-slate-800">Iniciar sesión</h1>

    {% if form.errors %}
      <p class="text-red-600 text-sm mb-4">Usuario o contraseña incorrectos.</p>
    {% endif %}

    <form method="post" action="{% url 'login' %}">
      {% csrf_token %}

      <div class="mb-4">
        <label for="{{ form.username.id_for_label }}" class="block text-sm font-medium text-slate-700 mb-1">
          Usuario
        </label>
        {{ form.username }}
      </div>

      <div class="mb-6">
        <label for="{{ form.password.id_for_label }}" class="block text-sm font-medium text-slate-700 mb-1">
          Contraseña
        </label>
        {{ form.password }}
      </div>

      <input type="hidden" name="next" value="{{ next }}">

      <button type="submit"
              class="w-full bg-indigo-600 text-white font-medium py-2 rounded-md hover:bg-indigo-700 transition">
        Iniciar sesión
      </button>
    </form>
  </div>
</div>
{% endblock %}
